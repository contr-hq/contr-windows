name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  comments:
    uses: contr-hq/.github/.github/workflows/comment-lint.yml@main

  glyphs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # A Private Use Area character is invisible in editors and diffs; icons are written as escapes.
      - name: Require icon glyphs to be written as escapes
        run: |
          if grep -rnP '[\x{E000}-\x{F8FF}]' --include='*.cs' --include='*.xaml' src tests; then exit 1; fi

  sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: contr-hq/contr
          path: .contr
          fetch-depth: 0
      - name: Regenerate the SDK from the pinned core commit
        run: scripts/update-sdk.sh .contr "$(cat gen/CORE_COMMIT)"
      - name: Require the committed SDK to match
        run: |
          git add --intent-to-add -- gen
          git diff --exit-code -- gen

  windows:
    runs-on: windows-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Contr.slnx

      - name: Verify formatting
        run: dotnet format Contr.slnx --verify-no-changes --severity warn --no-restore --exclude gen

      # dotnet format leaves a compiler server holding the analyzer assemblies the build rewrites (CS2012).
      - name: Release the analyzer assemblies
        run: dotnet build-server shutdown

      - name: Build
        run: dotnet build Contr.slnx -c Release --no-restore

      # Unpackaged WinUI test executables exit before their first test when no matching runtime is installed.
      - name: Install the Windows App Runtime
        shell: pwsh
        run: |
          $props = [xml](Get-Content Directory.Packages.props)
          $version = $props.SelectSingleNode("//PackageVersion[@Include='Microsoft.WindowsAppSDK']").Version
          $channel = ($version -split '\.')[0..1] -join '.'
          $installer = Join-Path $env:RUNNER_TEMP 'WindowsAppRuntimeInstall.exe'
          Invoke-WebRequest -Uri "https://aka.ms/windowsappsdk/$channel/$version/windowsappruntimeinstall-x64.exe" -OutFile $installer
          & $installer --quiet
          if ($LASTEXITCODE -ne 0) { throw "the runtime installer exited $LASTEXITCODE" }

      - name: Test
        run: dotnet test Contr.slnx -c Release --no-build
